name: Deploy JobRadar assistant

on:
  workflow_dispatch:
    inputs:
      approved_phones:
        description: Phone activation codes, comma-separated. Leave empty to keep current approvals.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: jobradar-assistant-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare Worker secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ASSISTANT_CODE: ${{ secrets.ASSISTANT_CODE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APPROVED_DEVICE_CODES: ${{ inputs.approved_phones }}
          MAIL_DATABASE_ID: ${{ vars.MAIL_DATABASE_ID }}
          MAIL_TOKEN_KEY: ${{ secrets.MAIL_TOKEN_KEY }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          for name in OPENAI_API_KEY ASSISTANT_CODE CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Add $name in GitHub Actions secrets before deploying."
              exit 1
            fi
          done
          if [[ ! "$ASSISTANT_CODE" =~ ^[A-Za-z0-9_-]{24,128}$ ]]; then
            echo '::error::Use a random access code of 24–128 letters, numbers, underscores, or hyphens.'
            exit 1
          fi
          umask 077
          jq -n 'env | {OPENAI_API_KEY, ASSISTANT_CODE, APPROVED_DEVICE_CODES, MAIL_TOKEN_KEY, MICROSOFT_CLIENT_ID,
                      MICROSOFT_CLIENT_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET}
                 | with_entries(select(.value != null and .value != ""))' > "$RUNNER_TEMP/jobradar-worker-secrets.json"
          python3 - <<'PY'
          import base64
          import json
          import os
          import tomllib
          import uuid
          from pathlib import Path

          with open("assistant/wrangler.toml", "rb") as source:
              config = tomllib.load(source)
          database = os.environ.get("MAIL_DATABASE_ID")
          if database:
              try:
                  database = str(uuid.UUID(database))
                  key = base64.b64decode(os.environ["MAIL_TOKEN_KEY"],altchars=b"-_",validate=True)
              except (KeyError, ValueError):
                  raise SystemExit("Set a valid MAIL_DATABASE_ID and a base64-encoded 32-byte MAIL_TOKEN_KEY for the mailbox.")
              if len(key) != 32:
                  raise SystemExit("MAIL_TOKEN_KEY must decode to 32 bytes.")
              if not any(os.environ.get(p+"_CLIENT_ID") and os.environ.get(p+"_CLIENT_SECRET") for p in ("MICROSOFT","GOOGLE")):
                  raise SystemExit("Set one pair of mail provider client credentials before enabling mailbox connections.")
              config["d1_databases"] = [{"binding":"MAIL_DB","database_name":"jobradar-mail","database_id":database}]
          Path("assistant/wrangler.deploy.json").write_text(json.dumps(config),encoding="utf-8")
          PY
      - name: Deploy assistant
        id: worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: assistant
          wranglerVersion: '4.157.0'
          preCommands: ${{ vars.MAIL_DATABASE_ID != '' && 'wrangler d1 migrations apply MAIL_DB --remote --config wrangler.deploy.json' || '' }}
          command: deploy --config wrangler.deploy.json --secrets-file ${{ runner.temp }}/jobradar-worker-secrets.json
      - name: Verify a sample AI draft
        env:
          WORKER_URL: ${{ steps.worker.outputs.deployment-url }}
          ASSISTANT_CODE: ${{ secrets.ASSISTANT_CODE }}
        run: |
          python3 - <<'PY'
          import http.client
          import json
          import os
          import re
          import time
          from urllib.parse import urlencode

          worker = re.fullmatch(r"https://(jobradar-assistant\.[a-z0-9-]+\.workers\.dev)/?", os.environ["WORKER_URL"])
          if not worker:
              raise SystemExit("No jobradar-assistant workers.dev URL returned by Wrangler.")
          host = worker[1]

          def wait_for_worker():
              for attempt in range(8):
                  connection = http.client.HTTPSConnection(host, timeout=5)
                  try:
                      connection.request("GET", "/draft")
                      response = connection.getresponse()
                      if response.status == 405:
                          return
                      if response.status not in (404, 502, 503, 504):
                          raise SystemExit(f"The Worker readiness check failed with HTTP {response.status}.")
                  except OSError:
                      pass
                  finally:
                      connection.close()
                  if attempt < 7:
                      time.sleep(4)
              raise SystemExit("The deployed Worker did not become reachable in time for the sample draft.")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"**JobRadar Serveradresse** `https://{host}/draft`\n\n")
              wait_for_worker()
              data = urlencode({"code": os.environ["ASSISTANT_CODE"], "company": "Beispielbetrieb",
                               "industry": "Einzelhandel", "role": "minijob", "experience": "skip",
                               "time": "abends", "strength": "organisiert"})
              connection = http.client.HTTPSConnection(host, timeout=25)
              connection.request("POST", "/draft", data, {"Content-Type": "application/x-www-form-urlencoded"})
              response = connection.getresponse()
              if response.status != 200:
                  raise SystemExit(f"The sample draft failed with HTTP {response.status}. Check the Worker and OpenAI API project.")
              draft = json.loads(response.read(12000))
              if not all(isinstance(draft.get(key), str) and draft[key].strip() for key in ("subject", "body")):
                  raise SystemExit("The response did not contain an email subject and body.")
              summary.write("The Worker generated a sample draft successfully.\n")
          PY
      - name: Remove temporary secrets file
        if: always()
        run: rm -f -- "$RUNNER_TEMP/jobradar-worker-secrets.json"
